name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI never touches the fal API and needs no credentials: art is generated on a
# developer machine, committed as processed atlases, and only validated here.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Validate generated art
        run: npm run art:validate

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # There is no lifetime ceiling and no per-slot attempt cap (see pipeline/BUDGET.md),
      # so there is no ceiling to guard. What CI can still check is that the ledger tells
      # the truth: a released attempt gave its image back, a generated attempt has the
      # request it came from, and no live attempt duplicates a seed.
      - name: Image ledger is a truthful audit trail
        run: |
          node -e "
            const ledger = require('./pipeline/budget.json');
            const STATES = ['claimed', 'generated', 'released'];
            const problems = [];
            let live = 0;
            let released = 0;
            let spendUsd = 0;
            for (const [id, slot] of Object.entries(ledger.slots)) {
              if (slot.id !== id) problems.push(id + ': slot record id is ' + slot.id);
              const seenAttempt = new Set();
              const liveSeeds = new Set();
              for (const a of slot.attempts) {
                if (!STATES.includes(a.state)) {
                  problems.push(id + ' #' + a.attempt + ': unknown state ' + a.state);
                }
                if (seenAttempt.has(a.attempt)) {
                  problems.push(id + ': duplicate attempt number ' + a.attempt);
                }
                seenAttempt.add(a.attempt);
                if (a.state === 'released') {
                  released += 1;
                  if (a.costUsd !== undefined || a.url !== undefined) {
                    problems.push(id + ' #' + a.attempt + ': released attempt still carries cost or url');
                  }
                  continue;
                }
                live += 1;
                if (typeof a.costUsd === 'number') spendUsd += a.costUsd;
                if (liveSeeds.has(a.seed)) {
                  problems.push(id + ' #' + a.attempt + ': seed ' + a.seed + ' reused by a live attempt');
                }
                liveSeeds.add(a.seed);
                if (a.state === 'generated' && (!a.requestId || !a.url || typeof a.costUsd !== 'number')) {
                  problems.push(id + ' #' + a.attempt + ': generated attempt is missing requestId, url or costUsd');
                }
              }
            }
            if (ledger.limit !== undefined && !Number.isInteger(ledger.limit)) {
              problems.push('limit is present but not an integer');
            }
            if (ledger.perSlotLimit !== undefined && !Number.isInteger(ledger.perSlotLimit)) {
              problems.push('perSlotLimit is present but not an integer');
            }
            if (problems.length > 0) {
              for (const p of problems) console.error('::error::' + p);
              process.exit(1);
            }
            const caps = ledger.limit === undefined ? 'no ceiling' : 'ceiling ' + ledger.limit;
            console.log('Ledger OK: ' + live + ' image(s) recorded, \$' + spendUsd.toFixed(2) + ' spend, ' + released + ' released, ' + caps);
          "

      - name: No credentials committed
        run: |
          if git grep -nEI '(fal[_-]?key|FAL_KEY\s*=|Authorization:\s*Key\s+[a-f0-9])' \
               -- . ':!*.md' ':!package-lock.json'; then
            echo "::error::A credential-like string was found in the repository."
            exit 1
          fi
          echo "No credentials found."
